name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Repository guards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # OPEN_QUESTIONS Q2: the private reference corpus must never be committed.
      # .gitignore does not apply to already-tracked files, so this checks the
      # index itself.
      - name: No tracked K5000 binaries outside testdata/fixtures
        run: bash tools/check-no-corpus-binaries.sh

      # OPEN_QUESTIONS Q4: research evidence never raises an implementation
      # level on its own. Catch superseded evidence scales if they reappear.
      - name: No superseded verification scale
        run: |
          # CHANGELOG.md is excluded on purpose: it records what the scales used
          # to be, and rewriting history to satisfy a lint would be worse than
          # the lint.
          if grep -rn --include='*.md' --include='*.h' --include='*.hpp' --include='*.cpp' \
               --exclude=CHANGELOG.md \
               -E 'Verified \| Documented \| Observed \| Unknown|None / Observed / Documented / Corroborated' . ; then
            echo "::error::A superseded evidence scale is back. Use the evidence labels"
            echo "::error::(Hypothesis / Observed / VerifiedAgainstCorpus / GoldenTested /"
            echo "::error::HardwareVerified) or VerificationLevel. See docs/FORMAT_NOTES.md."
            exit 1
          fi
          echo "OK"

      # Invariant A must stay enforced by tests, not only by documentation:
      # patch length never comes from KAA pointers. See docs/FORMAT_NOTES.md.
      - name: Invariant A regression tests are present
        run: |
          count=$(grep -c 'INVARIANT A' tests/unit/test_kaa_bank.cpp || true)
          if [ "$count" -lt 2 ]; then
            echo "::error::The Invariant A regression tests are missing from"
            echo "::error::tests/unit/test_kaa_bank.cpp."
            exit 1
          fi
          echo "OK: $count Invariant A tests"

  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure (core + CLI + tests, no Qt)
        run: cmake --preset core-only -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build/core-only --config Debug

      # Golden tests that need the private corpus skip themselves when
      # K5000_REFERENCE_CORPUS is unset. See docs/TEST_MATRIX.md.
      #
      - name: Test
        run: ctest --test-dir build/core-only -C Debug --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.cpp src/**/*.h src/**/*.hpp tests/**/*.cpp tests/**/*.h)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ sources yet - nothing to check."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
