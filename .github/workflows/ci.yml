name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (MSVC)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Configure (core + CLI + tests, no Qt)
        run: cmake --preset core-only -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build/core-only --config Debug

      - name: Test
        run: ctest --test-dir build/core-only -C Debug --output-on-failure
        # Golden tests that need the external reference corpus skip themselves
        # when K5000_REFERENCE_CORPUS is unset. See docs/TEST_MATRIX.md.

  format:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.cpp src/**/*.h src/**/*.hpp tests/**/*.cpp tests/**/*.h)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ sources yet - nothing to check."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
